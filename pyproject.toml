[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-quotes"
version = "1.0.0"
description = "Feed estático de cotizaciones diarias de dos fondos chilenos para Portfolio Performance"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7,<9", "ruff==0.17.1"]

[tool.setuptools]
packages = ["fund_quotes", "fund_quotes.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
